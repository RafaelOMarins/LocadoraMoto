services:
  mysql:
    image: mysql:8.4
    ports:
    - "3306:3306"
    environment:
      - DB_PASSWORD = ${DB_PASSWORD}
      - DB_DATABASE = ${DB_NAME}
      - DB_USER = ${DB_USER}
    healtcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start periodo: 15s

  locamoto-back:
    build: .
    ports:
    - "8080:8080"
    environment:
      - DB_HOST = ${DB_HOST}
      - DB_PORT = ${DB_PORT}
      - DB_USER = ${DB_USER}
      - DB_PASSWORD = ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthhy
        restart: true